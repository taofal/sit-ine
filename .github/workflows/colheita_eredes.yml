name: Colheita E-Redes

on:
  schedule:
    # Dia 5 de cada mês, 06:41 UTC. Só grava se a E-Redes tiver processado os dados depois da última extração.
    - cron: "41 6 5 * *"
  workflow_dispatch:          # botão «Run workflow» para correr à mão

permissions:
  contents: write

concurrency:
  group: colheita-eredes
  cancel-in-progress: false

jobs:
  colher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extração (só os conjuntos que a E-Redes atualizou)
        run: python 3_scripts/extrair_eredes_aberto.py

      - name: Gravar no repositório
        run: |
          git config user.name  "colheita-eredes[bot]"
          git config user.email "colheita-eredes@users.noreply.github.com"
          mkdir -p 1_bruto/eredes-aberto
          git add 1_bruto/eredes-aberto
          if git diff --cached --quiet; then
            echo "Nada de novo."
            exit 0
          fi
          git commit -m "Colheita E-Redes $(date -u +'%Y-%m-%d %H:%M') UTC"
          # os outros agendamentos também gravam: rebase e repetir em caso de corrida
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
