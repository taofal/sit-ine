name: Colheita Banco de Portugal

on:
  schedule:
    # Dia 2 de cada mês, 06:23 UTC. O BP publica empréstimos e depósitos por região perto do fim do mês
    # seguinte ao de referência (p. ex. setembro a 27 de outubro); a Central de Balanços por região, em outubro.
    - cron: "23 6 2 * *"
  workflow_dispatch:          # botão «Run workflow» para correr à mão

permissions:
  contents: write

concurrency:
  group: colheita-bportugal
  cancel-in-progress: false

jobs:
  colher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extração (só os domínios que o BP atualizou)
        run: python 3_scripts/extrair_bportugal.py

      - name: Gravar no repositório
        run: |
          git config user.name  "colheita-bportugal[bot]"
          git config user.email "colheita-bportugal@users.noreply.github.com"
          mkdir -p 1_bruto/bportugal
          git add 1_bruto/bportugal
          if git diff --cached --quiet; then
            echo "Nada de novo."
            exit 0
          fi
          git commit -m "Colheita Banco de Portugal $(date -u +'%Y-%m-%d %H:%M') UTC"
          # o workflow do INE também grava de hora a hora: rebase e repetir em caso de corrida
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
