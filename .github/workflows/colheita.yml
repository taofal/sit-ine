name: Colheita INE

on:
  schedule:
    - cron: "17 * * * *"      # de hora a hora, ao minuto 17 (UTC)
    - cron: "47 * * * *"      # segunda marcação: o GitHub atrasa ou salta agendamentos em horas de muito tráfego
  workflow_dispatch:          # botão «Run workflow» para correr à mão

permissions:
  contents: write

concurrency:
  group: colheita-ine
  cancel-in-progress: false

jobs:
  colher:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Volta de colheita
        run: python 3_scripts/colheita_ine.py --pedidos 100 --minutos 40

      - name: Gravar no repositório
        run: |
          git config user.name  "colheita-ine[bot]"
          git config user.email "colheita-ine@users.noreply.github.com"
          git add 1_bruto 3_scripts/_estado
          if git diff --cached --quiet; then
            echo "Nada de novo."
            exit 0
          fi
          git commit -m "Colheita INE $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
