name: Colheita INE

on:
  schedule:
    - cron: "17 * * * *"      # de hora a hora, ao minuto 17 (UTC)
    - cron: "47 * * * *"      # segunda marcação: o GitHub atrasa ou salta agendamentos em horas de muito tráfego
  workflow_dispatch:          # botão «Run workflow» para correr à mão

permissions:
  contents: write

concurrency:
  group: colheita-ine
  cancel-in-progress: false

jobs:
  colher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Volta de colheita
        run: python 3_scripts/colheita_ine.py --pedidos 120 --minutos 50

      - name: Gravar no repositório
        if: always()              # grava o que houver mesmo que a volta tenha falhado
        run: |
          git config user.name  "colheita-ine[bot]"
          git config user.email "colheita-ine@users.noreply.github.com"
          # O GitHub recusa ficheiros > 100 MB (e com isso o push inteiro). Os que passem de 90 MB
          # vão comprimidos (.json.gz); o conteúdo descomprimido é exatamente a resposta do INE.
          find 1_bruto -type f -name '*.json' -size +90M -print -exec gzip -9 {} \;
          grande=$(find 1_bruto -type f -size +95M)
          if [ -n "$grande" ]; then
            echo "::warning::Ainda acima de 95 MB depois de comprimir — fica fora do commit: $grande"
            for f in $grande; do
              echo "$(date -u +'%Y-%m-%d %H:%M:%S')  aviso: $f > 95 MB mesmo comprimido — não gravado" >> 3_scripts/_estado/colheita_ine.log
              rm -f "$f"
            done
          fi
          git add 1_bruto 3_scripts/_estado
          if git diff --cached --quiet; then
            echo "Nada de novo."
            exit 0
          fi
          git commit -m "Colheita INE $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
